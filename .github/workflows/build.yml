name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
      - name: Publish plugins to the local Maven repository
        run: ./gradlew publishToMavenLocal --no-daemon --stacktrace
      - name: Verify the Gradle Spring Boot example records a cache
        working-directory: examples/gradle-spring-boot
        run: ../../gradlew aotCacheTraining verifyAotCache --no-daemon --stacktrace
      - name: Verify the Maven Spring Boot example records a cache
        working-directory: examples/maven-spring-boot
        run: mvn -B verify --no-transfer-progress -Daot.cache.record=true