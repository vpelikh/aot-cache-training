name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (defaults to the version in gradle.properties)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags so the tag check can see existing releases.
          fetch-depth: 0

      - name: Resolve the release version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^version=//p' gradle.properties | tr -d '[:space:]')"
          fi
          if [ -z "$version" ]; then
            echo "No version provided and none found in gradle.properties" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"

      - name: Fail if the tag already exists
        run: |
          if git ls-remote --tags --exit-code origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.version }} already exists" >&2
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify
        run: ./gradlew build --no-daemon --stacktrace -Pversion=${{ steps.version.outputs.version }}

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-daemon --stacktrace -Pversion=${{ steps.version.outputs.version }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralPublishing: 'true'
          ORG_GRADLE_PROJECT_mavenCentralAutomaticPublishing: 'true'
          ORG_GRADLE_PROJECT_mavenCentralDeploymentValidation: 'PUBLISHED'
          ORG_GRADLE_PROJECT_signAllPublications: 'true'
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Publish the Gradle plugin to the Plugin Portal
        run: ./gradlew :aot-cache-training-gradle-plugin:publishPlugins --no-daemon --stacktrace -Pversion=${{ steps.version.outputs.version }}
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Tag the release
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create the GitHub release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump the version for the next release
        run: |
          next="$(echo "${{ steps.version.outputs.version }}" | awk -F. -v OFS=. '{ $NF = $NF + 1; print }')"
          sed -i "s/^version=.*/version=$next/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump the version to $next [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"