group=io.github.vpelikh
version=0.1.0

org.gradle.caching=true
org.gradle.parallel=true

# The build runs on a JDK 25 toolchain, required to exercise the -XX:AOTCacheOutput
# recording flow. Published bytecode targets Java 17 (except the Maven plugin, whose
# descriptor generator cannot read newer class files), so the artifacts load widely.
org.gradle.java.installations.auto-download=false